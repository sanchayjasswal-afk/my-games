<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Ninja Click Variant</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-start: #1b3d6d;
      --bg-end: #07111f;
      --panel: rgba(255, 255, 255, 0.12);
      --text: #f8fbff;
      --accent: #ff7f50;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-shell {
      width: min(92vw, 900px);
      height: min(86vh, 640px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
      backdrop-filter: blur(10px);
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 4;
      pointer-events: none;
    }

    .hud .pill {
      background: var(--panel);
      padding: 10px 15px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.03em;
      backdrop-filter: blur(8px);
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #06223d;
      background: #ffd166;
      pointer-events: auto;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25);
    }

    #gameArea {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      background: radial-gradient(circle at top, rgba(255,255,255,0.15), transparent 36%), linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.16));
    }

    .message {
      position: absolute;
      inset: auto 0 28px 0;
      text-align: center;
      color: rgba(255,255,255,0.82);
      font-size: 1rem;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .fruit {
      position: absolute;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 2.2rem;
      transform-origin: center;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
      z-index: 3;
    }

    .fruit::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      pointer-events: none;
    }

    .fruit.pop {
      animation: burst 0.28s ease forwards;
    }

    .slice-mark {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.9);
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      pointer-events: none;
      animation: pulse 0.3s ease-out forwards;
      z-index: 4;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(5, 12, 26, 0.68);
      z-index: 5;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(8px);
    }

    .overlay.hidden { display: none; }

    .overlay-card {
      background: rgba(255,255,255,0.12);
      padding: 28px 24px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.16);
      width: min(88%, 360px);
      box-shadow: 0 18px 34px rgba(0,0,0,0.25);
    }

    .overlay-card h1 { margin: 0 0 10px; font-size: 1.8rem; }
    .overlay-card p { margin: 0 0 16px; line-height: 1.5; color: rgba(255,255,255,0.84); }

    @keyframes burst {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.25) rotate(18deg); opacity: 0; }
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Lives: <span id="lives">3</span></div>
      <button id="restartBtn">Restart</button>
    </div>

    <div id="gameArea">
      <div class="message">Tap the fruit before it drops!</div>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h1>Fruit Slice Tap</h1>
          <p>Catch the falling fruit by clicking it. Miss three and the round ends.</p>
          <button id="startBtn">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const fruitTypes = [
      { emoji: '🍎', color: '#ff4d4f', points: 1 },
      { emoji: '🍌', color: '#ffd166', points: 2 },
      { emoji: '🍇', color: '#8e44ad', points: 3 },
      { emoji: '🍊', color: '#ff8c42', points: 2 },
      { emoji: '🥝', color: '#2ecc71', points: 3 }
    ];

    let score = 0;
    let lives = 3;
    let running = false;
    let spawnTimer = 0;
    let lastTime = 0;
    let fruits = [];
    let animationFrame;

    function resetGame() {
      score = 0;
      lives = 3;
      fruits.forEach((fruit) => fruit.element.remove());
      fruits = [];
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Fruit Slice Tap';
      overlay.querySelector('p').textContent = 'Catch the falling fruit by clicking it. Miss three and the round ends.';
      overlay.querySelector('button').textContent = 'Start Game';
    }

    function startGame() {
      resetGame();
      running = true;
      overlay.classList.add('hidden');
      lastTime = performance.now();
      spawnTimer = 0;
      animationFrame = requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(animationFrame);
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Game Over';
      overlay.querySelector('p').textContent = `You scored ${score} points. Hit restart to play again.`;
      overlay.querySelector('button').textContent = 'Play Again';
    }

    function spawnFruit() {
      const fruitData = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
      const el = document.createElement('div');
      el.className = 'fruit';
      el.textContent = fruitData.emoji;
      el.style.background = `radial-gradient(circle at 30% 30%, white, ${fruitData.color})`;
      el.dataset.points = fruitData.points;

      const width = gameArea.clientWidth;
      const x = Math.random() * Math.max(width - 90, 1) + 40;
      const speed = 1.4 + Math.random() * 1.0;
      const drift = (Math.random() - 0.5) * 0.7;
      const rotation = (Math.random() - 0.5) * 0.4;

      el.style.left = `${x}px`;
      el.style.top = '-90px';
      gameArea.appendChild(el);

      fruits.push({
        element: el,
        x,
        y: -90,
        vx: drift,
        vy: speed,
        rotation,
        points: fruitData.points
      });
    }

    function sliceFruit(fruit) {
      fruit.element.classList.add('pop');
      fruit.element.textContent = '✨';
      fruit.element.style.background = 'linear-gradient(135deg, #fff9db, #ff7f50)';
      const burst = document.createElement('span');
      burst.className = 'slice-mark';
      burst.style.left = `${fruit.x}px`;
      burst.style.top = `${fruit.y}px`;
      gameArea.appendChild(burst);
      setTimeout(() => burst.remove(), 280);
      score += fruit.points;
      scoreEl.textContent = score;
      setTimeout(() => fruit.element.remove(), 180);
    }

    function missFruit(fruit) {
      fruit.element.remove();
      lives -= 1;
      livesEl.textContent = lives;
      if (lives <= 0) endGame();
    }

    function loop(timestamp) {
      if (!running) return;
      const delta = (timestamp - lastTime) / 16.67;
      lastTime = timestamp;
      spawnTimer += delta;

      if (spawnTimer > 14) {
        spawnFruit();
        spawnTimer = 0;
      }

      fruits = fruits.filter((fruit) => {
        fruit.x += fruit.vx * delta;
        fruit.y += fruit.vy * delta;
        fruit.element.style.left = `${fruit.x}px`;
        fruit.element.style.top = `${fruit.y}px`;
        fruit.element.style.transform = `rotate(${fruit.rotation}rad)`;

        if (fruit.y > gameArea.clientHeight + 60) {
          missFruit(fruit);
          return false;
        }
        return true;
      });

      animationFrame = requestAnimationFrame(loop);
    }

    gameArea.addEventListener('click', (event) => {
      if (!running) return;
      const target = event.target.closest('.fruit');
      if (!target) return;
      const fruitObject = fruits.find((item) => item.element === target);
      if (!fruitObject) return;
      sliceFruit(fruitObject);
      fruits = fruits.filter((item) => item.element !== target);
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    resetGame();
  </script>
</body>
</html>
